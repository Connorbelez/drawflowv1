<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FairLend hero synthesis concepts</title>
    <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #181818;
      background: #fff;
    }
    main {
      padding: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 18px;
      align-items: start;
    }
    figure {
      margin: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }
    figcaption {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.3;
      color: #333;
    }
    .prompt-card {
      padding: 14px;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }
    .prompt-card figcaption {
      margin-top: 0;
      font-weight: 700;
    }
    .prompt-card figcaption span {
      display: inline-block;
      margin-left: 6px;
      font-weight: 600;
      color: #7a4b16;
    }
    .prompt-card p {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: #555;
    }
    .empty-state {
      padding: 18px;
      color: #555;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }

    .tile-controls {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      opacity: 0.86;
    }
    .tile-controls button,
    .tile-controls a {
      padding: 6px 8px;
      font: inherit;
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
      color: #333;
      text-decoration: none;
      cursor: pointer;
      background: #fff;
      border: 1px solid #dfdfdf;
      border-radius: 7px;
    }
    .tile-controls button:hover,
    .tile-controls a:hover {
      background: #f6f6f6;
    }
    figure.selected img {
      outline: 3px solid #181818;
      outline-offset: 2px;
    }
    figure.hidden {
      display: none;
    }
    .image-viewer {
      max-width: min(94vw, 1400px);
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
    }
    .image-viewer::backdrop {
      background: rgba(0, 0, 0, 0.72);
    }
    .image-viewer-inner {
      display: grid;
      gap: 8px;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
    }
    .image-viewer img {
      width: auto;
      max-width: 90vw;
      max-height: 84vh;
      border: 0;
      border-radius: 8px;
    }
    .viewer-close {
      justify-self: end;
      padding: 6px 10px;
      cursor: pointer;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
    }
    </style>
  </head>
  <body>
    <main>
      <div class="grid">
        <figure data-card-id="licensed-project-review">
          <a class="image-link" href="01-licensed-project-review.png"
            ><img
              src="01-licensed-project-review.png"
              alt="Licensed Project Review"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="01-licensed-project-review.png"
              download="01-licensed-project-review.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Licensed Project Review"
            >
              Remove
            </button>
          </div>
          <figcaption>01. Licensed Project Review</figcaption>
        </figure>
        <figure data-card-id="company-trust-with-quiz">
          <a class="image-link" href="02-company-trust-with-quiz.png"
            ><img
              src="02-company-trust-with-quiz.png"
              alt="Company Trust With Quiz"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="02-company-trust-with-quiz.png"
              download="02-company-trust-with-quiz.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Company Trust With Quiz"
            >
              Remove
            </button>
          </div>
          <figcaption>02. Company Trust With Quiz</figcaption>
        </figure>
        <figure data-card-id="progress-draw-control-plane">
          <a class="image-link" href="03-progress-draw-control-plane.png"
            ><img
              src="03-progress-draw-control-plane.png"
              alt="Progress Draw Control Plane"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="03-progress-draw-control-plane.png"
              download="03-progress-draw-control-plane.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Progress Draw Control Plane"
            >
              Remove
            </button>
          </div>
          <figcaption>03. Progress Draw Control Plane</figcaption>
        </figure>
        <figure data-card-id="site-verified-brokerage">
          <a class="image-link" href="04-site-verified-brokerage.png"
            ><img
              src="04-site-verified-brokerage.png"
              alt="Site-Verified Brokerage"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="04-site-verified-brokerage.png"
              download="04-site-verified-brokerage.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Site-Verified Brokerage"
            >
              Remove
            </button>
          </div>
          <figcaption>04. Site-Verified Brokerage</figcaption>
        </figure>
        <figure data-card-id="two-door-priority-builder">
          <a class="image-link" href="05-two-door-priority-builder.png"
            ><img
              src="05-two-door-priority-builder.png"
              alt="Two-Door, Builder First"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="05-two-door-priority-builder.png"
              download="05-two-door-priority-builder.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Two-Door, Builder First"
            >
              Remove
            </button>
          </div>
          <figcaption>05. Two-Door, Builder First</figcaption>
        </figure>
        <figure data-card-id="capital-confidence-meter">
          <a class="image-link" href="06-capital-confidence-meter.png"
            ><img
              src="06-capital-confidence-meter.png"
              alt="Capital Confidence Meter"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="06-capital-confidence-meter.png"
              download="06-capital-confidence-meter.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Capital Confidence Meter"
            >
              Remove
            </button>
          </div>
          <figcaption>06. Capital Confidence Meter</figcaption>
        </figure>
        <figure data-card-id="permit-to-payout-path">
          <a class="image-link" href="07-permit-to-payout-path.png"
            ><img
              src="07-permit-to-payout-path.png"
              alt="Permit To Payout Path"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="07-permit-to-payout-path.png"
              download="07-permit-to-payout-path.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Permit To Payout Path"
            >
              Remove
            </button>
          </div>
          <figcaption>07. Permit To Payout Path</figcaption>
        </figure>
        <figure data-card-id="brokerage-card-as-conversion-anchor">
          <a
            class="image-link"
            href="08-brokerage-card-as-conversion-anchor.png"
            ><img
              src="08-brokerage-card-as-conversion-anchor.png"
              alt="Brokerage Card As Conversion Anchor"
            ></a
          >
          <div class="tile-controls">
            <button class="select-card" type="button" aria-pressed="false">
              Select
            </button><a
              class="download-card"
              href="08-brokerage-card-as-conversion-anchor.png"
              download="08-brokerage-card-as-conversion-anchor.png"
              >Download</a
            ><button
              class="remove-card"
              type="button"
              aria-label="Remove Brokerage Card As Conversion Anchor"
            >
              Remove
            </button>
          </div>
          <figcaption>08. Brokerage Card As Conversion Anchor</figcaption>
        </figure>
      </div>
    </main>
    <dialog class="image-viewer" id="imageViewer">
      <div class="image-viewer-inner">
        <button class="viewer-close" type="button">Close</button>
        <img id="viewerImage" alt="">
      </div>
    </dialog>
    <script>
    "use strict";
    (() => {
      var key = "creative-production-review:" + location.pathname;
      var stored = {};
      try {
        stored = JSON.parse(localStorage.getItem(key) || "{}");
      } catch (error) {
        stored = {};
      }
      var selected = new Set(stored.selected || []);
      var hidden = new Set(stored.hidden || []);
      function persist() {
        localStorage.setItem(
          key,
          JSON.stringify({
            selected: Array.from(selected),
            hidden: Array.from(hidden),
          })
        );
      }
      document.querySelectorAll("figure[data-card-id]").forEach((card) => {
        var id = card.getAttribute("data-card-id");
        if (selected.has(id)) {
          card.classList.add("selected");
        }
        if (hidden.has(id)) {
          card.classList.add("hidden");
        }
        var select = card.querySelector(".select-card");
        if (select) {
          select.setAttribute(
            "aria-pressed",
            selected.has(id) ? "true" : "false"
          );
          select.textContent = selected.has(id) ? "Selected" : "Select";
          select.addEventListener("click", () => {
            if (selected.has(id)) {
              selected.delete(id);
            } else {
              selected.add(id);
            }
            card.classList.toggle("selected", selected.has(id));
            select.setAttribute(
              "aria-pressed",
              selected.has(id) ? "true" : "false"
            );
            select.textContent = selected.has(id) ? "Selected" : "Select";
            persist();
          });
        }
        var remove = card.querySelector(".remove-card");
        if (remove) {
          remove.addEventListener("click", () => {
            hidden.add(id);
            card.classList.add("hidden");
            persist();
          });
        }
      });
      var viewer = document.getElementById("imageViewer");
      var viewerImage = document.getElementById("viewerImage");
      if (viewer && viewerImage) {
        document.querySelectorAll(".image-link").forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            viewerImage.src = link.getAttribute("href");
            if (typeof viewer.showModal === "function") {
              viewer.showModal();
            } else {
              location.href = link.getAttribute("href");
            }
          });
        });
        viewer.querySelector(".viewer-close").addEventListener("click", () => {
          viewer.close();
        });
        viewer.addEventListener("click", (event) => {
          if (event.target === viewer) {
            viewer.close();
          }
        });
      }
    })();
    </script>
  </body>
</html>
