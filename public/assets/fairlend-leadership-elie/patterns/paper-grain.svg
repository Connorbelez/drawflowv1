<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 .09"/>
    </feComponentTransfer>
  </filter>
  <rect width="220" height="220" fill="#FAF5EC"/>
  <rect width="220" height="220" filter="url(#grain)" opacity=".45"/>
</svg>
