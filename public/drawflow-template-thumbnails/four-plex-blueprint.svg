<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">4-plex blueprint elevation</title>
  <desc id="desc">Blueprint-style front elevation of a four-unit residential building.</desc>
  <defs>
    <linearGradient id="sheet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#062a52" />
      <stop offset="0.58" stop-color="#042041" />
      <stop offset="1" stop-color="#03172f" />
    </linearGradient>
    <pattern id="smallGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#0f69a2" stroke-opacity="0.16" stroke-width="0.7" />
    </pattern>
    <pattern id="largeGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#41b9ff" stroke-opacity="0.13" stroke-width="1.1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .paper { fill: url(#sheet); }
      .grid-a { fill: url(#smallGrid); }
      .grid-b { fill: url(#largeGrid); }
      .frame { fill: none; stroke: #1bb8ff; stroke-opacity: 0.72; stroke-width: 1.1; }
      .guide { fill: none; stroke: #22c7ff; stroke-dasharray: 7 5; stroke-linecap: round; stroke-opacity: 0.78; stroke-width: 1.2; }
      .dim { fill: none; stroke: #4dd8ff; stroke-linecap: round; stroke-opacity: 0.86; stroke-width: 1.4; }
      .thin { fill: none; stroke: #b9ecff; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.78; stroke-width: 1.15; }
      .line { fill: none; stroke: #e7f8ff; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.96; stroke-width: 2.05; }
      .cyan { fill: none; stroke: #54d8ff; stroke-linecap: round; stroke-linejoin: round; stroke-opacity: 0.96; stroke-width: 2; }
      .shade { fill: #0d5b91; fill-opacity: 0.16; stroke: #85e4ff; stroke-opacity: 0.62; stroke-width: 1; }
      .label { fill: #8ceaff; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.08em; opacity: 0.72; }
    </style>
  </defs>

