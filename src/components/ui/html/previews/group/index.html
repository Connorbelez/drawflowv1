<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="group">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Group</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Group preview">
        <div class="df-group" role="group" aria-label="Draw view controls">
          <button class="df-button df-button-outline">Roadmap</button>
          <span class="df-group-separator"></span>
          <button class="df-button df-button-outline active">Draws</button>
          <span class="df-group-separator"></span>
          <button class="df-button df-button-outline">Evidence</button>
        </div>
      </section>
    </main>
  </body>
</html>
