<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sortable List HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="sortable-list">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Sortable List</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Sortable List preview">
        <div class="df-sortable" data-sortable>
          <article class="df-sort-item" draggable="true"><span class="df-grip">⋮⋮</span><div><strong>Permits posted</strong><small>Milestone 1</small></div><span class="df-badge secondary">Ready</span></article>
          <article class="df-sort-item" draggable="true"><span class="df-grip">⋮⋮</span><div><strong>Foundation complete</strong><small>Milestone 2</small></div><span class="df-badge secondary">Ready</span></article>
          <article class="df-sort-item" draggable="true"><span class="df-grip">⋮⋮</span><div><strong>Framing inspection</strong><small>Milestone 3</small></div><span class="df-badge secondary">Review</span></article>
          <article class="df-sort-item" draggable="true"><span class="df-grip">⋮⋮</span><div><strong>MEP rough-in</strong><small>Milestone 4</small></div><span class="df-badge secondary">Ready</span></article>
        </div>
      </section>
    </main>
  </body>
</html>
