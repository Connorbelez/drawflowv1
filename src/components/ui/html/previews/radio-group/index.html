<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Group HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="radio-group">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Radio Group</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Radio Group preview">
        <fieldset class="df-radio-group"><legend>Plan strategy</legend><label><input type="radio" name="strategy" checked /><span></span>Cheapest feasible</label><label><input type="radio" name="strategy"  /><span></span>Fastest</label><label><input type="radio" name="strategy"  /><span></span>Capital constrained</label></fieldset>
      </section>
    </main>
  </body>
</html>
