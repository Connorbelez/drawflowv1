<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badge HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="badge">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Badge</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Badge preview">
        <div class="df-inline"><span class="df-badge default">Default</span><span class="df-badge secondary">Secondary</span><span class="df-badge outline">Outline</span><span class="df-badge success">Success</span><span class="df-badge warning">Warning</span><span class="df-badge destructive">Destructive</span></div>
      </section>
    </main>
  </body>
</html>
