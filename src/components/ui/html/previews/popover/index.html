<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popover HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="popover">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Popover</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Popover preview">
        <div class="df-popover-demo"><button class="df-button df-button-outline" data-popover-trigger>Policy limit</button><div class="df-popover" data-popover hidden><h3>Lender draw policy limit</h3><p>Maximum reimbursable amount per draw is $95,000.</p></div></div>
      </section>
    </main>
  </body>
</html>
