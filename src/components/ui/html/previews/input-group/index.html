<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input Group HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="input-group">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>

        <div class="df-input-group"><span>$</span><input value="86,400" aria-label="Amount" /><button>Verify</button></div>
      </section>
    </main>
  </body>
