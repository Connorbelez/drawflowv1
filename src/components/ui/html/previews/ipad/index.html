<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ipad HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="ipad">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Ipad</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Ipad preview">
        <div class="df-device df-device-ipad"><div class="df-device-screen"><header><strong>Site visit</strong><span class="df-badge success">Offline draft</span></header><div class="df-device-map">Geofence attempt</div><footer><button class="df-button df-button-default">Capture report</button></footer></div></div>
      </section>
    </main>
  </body>
</html>
