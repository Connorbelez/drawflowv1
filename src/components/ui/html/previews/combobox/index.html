<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combobox HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="combobox">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Combobox</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Combobox preview">
        <div class="df-combobox"><input class="df-input" value="Framing inspection" aria-label="Milestone" /><div class="df-menu static"><button class="df-menu-item">Framing inspection</button><button class="df-menu-item">Foundation inspection</button><button class="df-menu-item">MEP rough-in</button></div></div>
      </section>
    </main>
  </body>
</html>
