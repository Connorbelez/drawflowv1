<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="sheet">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Sheet</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Sheet preview">
        <div><button class="df-button df-button-outline" data-sheet-open>Open sheet</button><aside class="df-sheet" data-sheet><button class="df-icon-button" data-sheet-close><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2>Admin approval</h2><p>Approve release after evidence and site visit checks pass.</p><button class="df-button df-button-default">Release funds</button></aside></div>
      </section>
    </main>
  </body>
</html>
