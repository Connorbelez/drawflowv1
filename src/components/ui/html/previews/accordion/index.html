<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accordion HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="accordion">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Accordion</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Accordion preview">
        <div class="df-accordion" data-accordion>
          <article class="df-accordion-item" data-open><button>Budget version<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div><p>Budget revisions are versioned and never overwrite the approved baseline.</p></div></article>
          <article class="df-accordion-item" ><button>Evidence rules<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div><p>Geofence failure marks evidence location-unverified while preserving uploads.</p></div></article>
          <article class="df-accordion-item" ><button>Release authority<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div><p>Lender admins retain final draw-release authority.</p></div></article>
        </div>
      </section>
    </main>
  </body>
</html>
