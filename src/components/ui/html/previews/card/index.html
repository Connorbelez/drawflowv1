<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="card">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Card</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Card preview">
        <article class="df-card"><header><p>Draw 03</p><h2>Framing reimbursement</h2></header><p>Evidence review is complete. One site visit report is awaiting admin override.</p><footer><span class="df-badge warning">Admin review</span><strong>$86,400</strong></footer></article>
      </section>
    </main>
  </body>
</html>
