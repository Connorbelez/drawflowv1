<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autocomplete HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="autocomplete">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Autocomplete</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Autocomplete preview">
        <div class="df-autocomplete" data-autocomplete>
          <label class="df-label" for="autocomplete-build">Assign reviewer</label>
          <input id="autocomplete-build" class="df-input" value="Ari Lender" aria-controls="autocomplete-options" aria-expanded="true" />
          <div class="df-menu static" id="autocomplete-options" role="listbox">
            <button class="df-menu-item" role="option" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 6-11 11-5-5"/></svg><span>Ari Lender</span><small>Admin</small></button>
            <button class="df-menu-item" role="option"><span class="df-dot success"></span><span>Maya Field</span><small>Inspector</small></button>
            <button class="df-menu-item" role="option"><span class="df-dot warning"></span><span>Noah Risk</span><small>Staff reviewer</small></button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
