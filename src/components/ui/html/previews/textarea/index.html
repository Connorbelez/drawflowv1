<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Textarea HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="textarea">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Textarea</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Textarea preview">
        <textarea class="df-textarea" aria-label="Notes">Borrower submitted updated framing photos from the north elevation.</textarea>
      </section>
    </main>
  </body>
</html>
