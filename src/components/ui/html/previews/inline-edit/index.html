<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inline Edit HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="inline-edit">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Inline Edit</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Inline Edit preview">
        <div class="df-inline-edit" data-inline-edit>
          <label class="df-label" for="inline-edit-budget">Milestone budget</label>
          <div><input id="inline-edit-budget" class="df-input" value="$86,400" /><button class="df-button df-button-default">Save</button></div>
          <p class="df-help">Budget revisions create a new version and audit event.</p>
        </div>
      </section>
    </main>
  </body>
</html>
