<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carousel HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="carousel">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Carousel</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Carousel preview">
        <div class="df-carousel" data-carousel><div class="df-carousel-track"><article class="df-carousel-slide active"><strong>Foundation</strong><span>Evidence package 1</span></article><article class="df-carousel-slide "><strong>Framing</strong><span>Evidence package 2</span></article><article class="df-carousel-slide "><strong>MEP</strong><span>Evidence package 3</span></article></div><button class="df-icon-button" data-carousel-prev>‹</button><button class="df-icon-button" data-carousel-next>›</button></div>
      </section>
    </main>
  </body>
</html>
