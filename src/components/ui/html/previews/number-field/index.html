<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Number Field HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="number-field">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Number Field</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Number Field preview">
        <div class="df-number-field" data-number-field>
          <label class="df-label" for="number-field-draw">Draw fee</label>
          <div><button class="df-icon-button" aria-label="Decrease">−</button><input id="number-field-draw" class="df-input" type="number" value="450" /><button class="df-icon-button" aria-label="Increase">+</button></div>
          <p class="df-help">Lender configurable per released draw.</p>
        </div>
      </section>
    </main>
  </body>
</html>
