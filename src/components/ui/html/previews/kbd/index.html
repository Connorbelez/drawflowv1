<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kbd HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="kbd">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Kbd</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Kbd preview">
        <p class="df-kbd-row">Open command menu <kbd class="df-kbd">⌘</kbd><kbd class="df-kbd">K</kbd></p>
      </section>
    </main>
  </body>
</html>
