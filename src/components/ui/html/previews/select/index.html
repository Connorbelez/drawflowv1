<!doctype html>

  <head>
    <meta charset="utf-8" />

    <title>Select HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="select">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Select</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Select preview">
        <div class="df-select"><button data-menu-trigger="select">Select status <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="df-menu" data-menu="select" hidden><button class="df-menu-item">Ready for admin</button><button class="df-menu-item">Needs evidence</button><button class="df-menu-item">Site visit required</button></div></div>
      </section>
    </main>
