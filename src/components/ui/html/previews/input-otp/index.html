<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Input Otp HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="input-otp">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Input Otp</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Input Otp preview">
        <div class="df-otp" data-otp><input maxlength="1" inputmode="numeric" value="2" /><input maxlength="1" inputmode="numeric" value="3" /><input maxlength="1" inputmode="numeric" value="4" /><input maxlength="1" inputmode="numeric" value="" /><input maxlength="1" inputmode="numeric" value="" /><input maxlength="1" inputmode="numeric" value="" /></div>
      </section>
    </main>
  </body>
</html>
