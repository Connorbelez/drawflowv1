<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context Menu HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="context-menu">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Context Menu</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Context Menu preview">
        <div class="df-context-target" data-context-target>Right click milestone card<div class="df-menu context" data-context-menu hidden><button class="df-menu-item">Open</button><button class="df-menu-item">Duplicate</button><button class="df-menu-item danger">Archive</button></div></div>
      </section>
    </main>
  </body>
</html>
