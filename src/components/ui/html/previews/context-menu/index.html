<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context Menu HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="context-menu">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Context Menu</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Context Menu preview">
        <div class="df-context-target" data-context-target>
          Right click milestone card
          <div class="df-menu context" data-context-menu hidden>
            <div class="df-menu-section">
              <div class="df-menu-label">Milestone</div>
              <button class="df-menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
                <span>Open</span>
                <kbd>⌘O</kbd>
              </button>
              <button class="df-menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect width="14" height="14" x="8" y="8" rx="2" />
                  <path
                    d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                  />
                </svg>
                <span>Duplicate</span>
                <kbd>⌘D</kbd>
              </button>
              <button class="df-menu-item disabled">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 4v16" />
                  <path d="M4 8h12l-2-4H4" />
                </svg>
                <span>Mark complete</span>
              </button>
            </div>
            <div class="df-menu-separator"></div>
            <button class="df-menu-item switch">
              <span>Require site visit</span>
              <span class="df-menu-switch" aria-hidden="true"></span>
            </button>
            <div class="df-menu-separator"></div>
            <button class="df-menu-item submenu">
              <span>Move to draw group</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
            <div class="df-menu-separator"></div>
            <button class="df-menu-item danger">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M19 6 18 20H6L5 6" />
              </svg>
              <span>Delete</span>
              <kbd>⌘⌫</kbd>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
