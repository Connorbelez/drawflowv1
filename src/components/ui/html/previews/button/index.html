<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="button">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Button</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Button preview">
        <div class="df-inline"><button class="df-button df-button-default">default</button><button class="df-button df-button-outline">outline</button><button class="df-button df-button-secondary">secondary</button><button class="df-button df-button-ghost">ghost</button><button class="df-button df-button-destructive">destructive</button><button class="df-button df-button-link">link</button></div>
      </section>
    </main>
  </body>
</html>
