<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meter HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="meter">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Meter</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Meter preview">
        <div class="df-meter-block"><div><span>Borrower working capital used</span><strong>$82k / $125k</strong></div><meter class="df-meter" min="0" max="125" value="82">66%</meter><p>Under limit after draw grouping optimization.</p></div>
      </section>
    </main>
  </body>
</html>
