<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolbar HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="toolbar">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Toolbar</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Toolbar preview">
        <div class="df-toolbar" role="toolbar" aria-label="Evidence editor toolbar">
          <div class="df-toolbar-group"><button class="df-icon-button" aria-label="Bold"><strong>B</strong></button><button class="df-icon-button" aria-label="Italic"><em>I</em></button></div>
          <span class="df-toolbar-separator"></span>
          <input class="df-toolbar-input" value="Reviewer note" aria-label="Toolbar input" />
          <button class="df-button df-button-default">Apply</button>
        </div>
      </section>
    </main>
  </body>
</html>
