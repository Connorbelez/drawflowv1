<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart HTML Snippet</title>
    <link rel="stylesheet" href="../../assets/ui.css" />
    <script defer src="../../assets/ui.js"></script>
  </head>
  <body>
    <main class="snippet-shell" data-component="chart">
      <header class="snippet-header">
        <span class="snippet-eyebrow">DrawFlow UI HTML</span>
        <h1>Chart</h1>
        <p>Standalone preview of the composable HTML component fragment.</p>
      </header>
      <section class="snippet-stage" aria-label="Chart preview">
        <div class="df-chart"><div class="bars"><span style="height:52%" data-label="D1"></span><span style="height:82%" data-label="D2"></span><span style="height:64%" data-label="D3"></span><span style="height:38%" data-label="D4"></span><span style="height:72%" data-label="D5"></span></div><footer><strong>Draw cost curve</strong><span>Fee + interest exposure</span></footer></div>
      </section>
    </main>
  </body>
</html>
